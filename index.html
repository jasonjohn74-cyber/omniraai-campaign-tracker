  return html`<div style=${{display:'flex',flexWrap:'wrap',gap:5}}>
    ${opts.map(o=>{const on=selected.includes(o);return html`<button key=${o} onClick=${()=>onToggle(o)}
      style=${{background:on?C.ac:C.s3,color:on?'#fff':C.dm,border:`0.5px solid ${on?C.ac:C.bd}`,borderRadius:20,padding:'4px 11px',fontSize:12,cursor:'pointer'}}>${o}</button>`;})}</div>`;
}
function Lb({children}){return html`<div style=${{fontSize:11,color:C.dm,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:5}}>${children}</div>`;}
function Fd({label,span2,req,hint,children}){return html`<div style=${{gridColumn:span2?'span 2':'span 1'}}>
  <div style=${{fontSize:11,color:C.dm,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:5,display:'flex',gap:4,alignItems:'center'}}>${label}${req&&html`<span style=${{color:C.er}}>*</span>`}</div>
  ${children}
  ${hint&&html`<div style=${{fontSize:11,color:C.mt,marginTop:4,lineHeight:1.5}}>${hint}</div>`}
</div>`;}
function SBadge({status}){const s=STATUSES[status]||STATUSES.draft;return html`<span style=${{background:s.bg,color:s.c,border:`0.5px solid ${s.c}50`,borderRadius:20,padding:'3px 11px',fontSize:11,fontWeight:500,whiteSpace:'nowrap'}}>${s.l}</span>`;}

  ${sub&&html`<div style=${{fontSize:12,color:C.mt,marginBottom:10,lineHeight:1.5}}>${sub}</div>`}

</div>`;}
function Spinner(){return html`<div style=${{display:'flex',alignItems:'center',justifyContent:'center',gap:10,padding:'40px',color:C.dm,fontSize:13}}><div style=${{width:18,height:18,border:`2px solid ${C.bd}`,borderTop:`2px solid ${C.ac}`,borderRadius:'50%',animation:'spin 0.8s linear infinite'}}></div>Loading…</div>`;}

// Quick emoji palette — inserts at cursor in the linked field
function EmojiBar({onPick}){
  const EMOJIS=['🎾','🏓','🔥','💪','🚀','🎯','✅','⭐','🎉','💥','⚡','🏆','👇','👉','📅','💰','🤝','😊','🙌','❤️'];
  return html`<div style=${{display:'flex',gap:4,flexWrap:'wrap',marginTop:6}}>
    ${EMOJIS.map(em=>html`<button key=${em} type="button" onClick=${()=>onPick(em)} title="Insert ${em}"
      style=${{background:'transparent',border:`0.5px solid ${C.bd}`,borderRadius:5,padding:'2px 7px',fontSize:15,cursor:'pointer',lineHeight:1.3}}>${em}</button>`)}
  </div>`;
}

// Create an email (AI-generated or manual) → content_approvals → App 4 approves → Brevo sends.
function EmailComposer({clients,onClose,showToast}){
  const[seriesName,setSeriesName]=useState('');
  const[subject,setSubject]=useState('');
  const[body,setBody]=useState('');
  const[banner,setBanner]=useState('');
  const[ctas,setCtas]=useState([]);
  const[footer,setFooter]=useState(DEFAULT_EMAIL_FOOTER);
  const[schedDate,setSchedDate]=useState('');
  const[schedTime,setSchedTime]=useState('09:00');
  const[sendList,setSendList]=useState('titan_active');
  const[clientId,setClientId]=useState('');
  const[aiBrief,setAiBrief]=useState('');
  const[aiBusy,setAiBusy]=useState(false);
  const[saving,setSaving]=useState(false);

  const addCta=()=>setCtas(p=>[...p,{label:'',url:'',desc:''}]);
  const subjRef=useRef(null), bodyRef=useRef(null);
  // Email Kit: per-client reusable components saved in App 1 (clients.data.emailKit)
  function applyKit(force){
    const c=clients.find(x=>x.id===clientId);
    const kit=c&&c.emailKit;
    if(!kit||(!kit.footer&&!kit.bannerUrl&&!(kit.ctas||[]).length)){
      if(force)showToast('No Email Kit saved for this client yet — add one in Brand Manager (App 1) → Brand Voice tab','er');
      return;
    }
    if(kit.footer&&(force||footer===DEFAULT_EMAIL_FOOTER||!footer.trim()))setFooter(kit.footer);
    if(kit.bannerUrl&&(force||!banner.trim()))setBanner(kit.bannerUrl);
    if(Array.isArray(kit.ctas)&&kit.ctas.filter(x=>x.label&&x.url).length&&(force||ctas.length===0))
      setCtas(kit.ctas.filter(x=>x.label&&x.url).map(x=>({label:x.label||'',url:x.url||'',desc:x.desc||''})));
    if(force)showToast('Email Kit applied ✓','ok');
  }
  useEffect(()=>{applyKit(false);},[clientId]);
  // Insert emoji at cursor (falls back to append)
  const pickEmoji=(ref,cur,set)=>em=>{
    const el=ref.current;
    if(el&&typeof el.selectionStart==='number'){
      const s=el.selectionStart,e2=el.selectionEnd;
      set(cur.slice(0,s)+em+cur.slice(e2));
      setTimeout(()=>{try{el.focus();el.setSelectionRange(s+em.length,s+em.length);}catch(e){}},0);
    }else set(cur+em);
  };
  const updCta=(i,f,v)=>setCtas(p=>p.map((c,j)=>j===i?{...c,[f]:v}:c));
  const rmCta=i=>setCtas(p=>p.filter((_,j)=>j!==i));

  async function aiGenerate(){
    if(!aiBrief.trim()){showToast('Describe the email you want AI to write','er');return;}
    setAiBusy(true);
    const sys='You are an expert email marketing copywriter for Malaysian brands. Write engaging, concise marketing emails.';
    const usr=`Write a marketing email from this brief: ${aiBrief}\n${seriesName?'Series theme: '+seriesName+'\n':''}Return ONLY valid JSON, no markdown: {"subject":"compelling subject line","body":"full body copy, plain text with line breaks, no signature/footer"}`;
    try{
      const res=await fetch(`${N8N_BASE}/webhook/claude-proxy`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:sys,prompt:usr})});
      const raw=await res.text();let data;try{data=JSON.parse(raw);}catch{throw new Error('Bad response');}
      let txt=(data?.content?.[0]?.text||data?.[0]?.content?.[0]?.text||data?.body?.content?.[0]?.text||'').trim();
      txt=txt.replace(/^```json\s*/i,'').replace(/```$/,'').trim();
      let parsed;try{parsed=JSON.parse(txt);}catch{parsed={subject:'',body:txt};}
      if(parsed.subject)setSubject(parsed.subject);
      if(parsed.body)setBody(parsed.body);
      showToast('AI draft ready — review & edit below ✓','ok');
    }catch(e){showToast('AI failed: '+e.message,'er');}
    setAiBusy(false);
  }

  async function save(approve){
    if(!subject.trim()){showToast('Add an email subject','er');return;}
    if(!body.trim()){showToast('Add body copy','er');return;}
    if(!schedDate){showToast('Set a broadcast date','er');return;}
    setSaving(true);
    const scheduledFor=new Date(`${schedDate}T${(schedTime||'09:00')}:00+08:00`).toISOString();
    const client=clients.find(c=>c.id===clientId);
    const rec={
      id:(window.crypto&&crypto.randomUUID)?crypto.randomUUID():uid(),
      content_type:'email',
      subject:subject,
      status:approve?'approved':'pending',
      scheduled_for:scheduledFor,
      ...(approve?{approved_at:new Date().toISOString()}:{}),
      full_content:{
        seriesName,emailSubject:subject,drillDescription:body,emailBody:body,
        bannerImage:banner,ctaButtons:ctas.filter(c=>c.label&&c.url),footer,
        sendListId:sendList,clientId,clientName:client?.basics?.brandName||client?.basics?.clientName||'',
        created_via:'app2_composer'
      }
    };
    const ok=await db.createEmailCA(rec);
    setSaving(false);
    if(ok){showToast(approve?'Email created & approved — ready to send ✓':'Email saved — review in App 4 for approval ✓','ok');onClose();}
    else showToast('Save failed — check console','er');
  }

  const G={display:'grid',gridTemplateColumns:'1fr 1fr',gap:'14px 20px'};
  return html`<div style=${{maxWidth:860,margin:'0 auto',padding:'24px',animation:'fadeIn 0.2s ease'}}>
    <div style=${{marginBottom:20}}>
      <div style=${{fontSize:19,fontWeight:600,color:C.tx}}>Compose Email</div>
      <div style=${{fontSize:13,color:C.dm,marginTop:3}}>AI-generate or write manually → saves to App 4 for approval → blasts via Brevo on your schedule.</div>
    </div>

    <${Card} style=${{padding:22,marginBottom:14}}>
      <${Sec} t="🤖 AI Draft (optional)" sub="Describe the email and let AI write the subject + body. You can edit everything after.">
        <textarea style=${inp({resize:'vertical',minHeight:60})} value=${aiBrief} onChange=${e=>setAiBrief(e.target.value)} placeholder="e.g. Announce our June 2-for-1 ball machine session promo at partner courts, friendly and energetic, drive bookings"/>
        <button onClick=${aiGenerate} disabled=${aiBusy} style=${pbtn(true,{marginTop:10,fontSize:13,padding:'8px 18px',opacity:aiBusy?0.6:1})}>${aiBusy?'🤖 Writing…':'🤖 Generate Draft'}</button>
      </${Sec}>
    </${Card}>

    <${Card} style=${{padding:22,marginBottom:14}}>
      <${Sec} t="Email content">
        <div style=${{marginBottom:14}}>
          <${Fd} label="Series Group Theme (optional)" hint="If part of a recurring series e.g. 'TDOW' or 'Real Gains'. Leave blank for a one-off.">
            <input style=${inp()} value=${seriesName} onChange=${e=>setSeriesName(e.target.value)} placeholder="e.g. Drill of the Week"/>
          </${Fd}>
        </div>
        <div style=${{marginBottom:14}}>
          <${Lb}>Email Subject Header *</${Lb}>
          <input ref=${subjRef} style=${inp()} value=${subject} onChange=${e=>setSubject(e.target.value)} placeholder="Subject line recipients see…"/>
          <${EmojiBar} onPick=${pickEmoji(subjRef,subject,setSubject)}/>
        </div>
        <div style=${{marginBottom:14}}>
          <${Lb}>Main Body Copy *</${Lb}>
          <textarea ref=${bodyRef} style=${inp({resize:'vertical',minHeight:160,lineHeight:1.7})} value=${body} onChange=${e=>setBody(e.target.value)} placeholder="Write the email body. You can paste links inline as needed…"/>
          <${EmojiBar} onPick=${pickEmoji(bodyRef,body,setBody)}/>
          <div style=${{fontSize:11,color:C.mt,marginTop:4}}>Paste external links directly in the copy. Write <b>{{firstName}}</b> anywhere (subject too) — each recipient sees their own first name, e.g. "Hi Jason". Add clickable CTA buttons below.</div>
        </div>
        <div>
          <${Lb}>Email Banner Image URL (optional)</${Lb}>
          <input style=${inp()} value=${banner} onChange=${e=>setBanner(e.target.value)} placeholder="https://… (header image shown at top of email)"/>
        </div>
      </${Sec}>
    </${Card}>

    <${Card} style=${{padding:22,marginBottom:14}}>
      <${Sec} t="Call-to-action buttons" sub="Each button is clickable and links to any URL — website, Google Drive, YouTube, booking page." action=${html`<button onClick=${addCta} style=${pbtn(false,{fontSize:12,padding:'4px 12px'})}>+ Add button</button>`}>
        ${ctas.length===0?html`<div style=${{fontSize:12,color:C.mt}}>No CTA buttons yet. Add one if you want a clickable button in the email.</div>`:''}
        ${ctas.map((c,i)=>html`<div key=${i} style=${{border:`0.5px solid ${C.bd}`,borderRadius:8,padding:10,marginBottom:10}}>
          <div style=${{display:'grid',gridTemplateColumns:'1fr 1.6fr auto',gap:8,alignItems:'center',marginBottom:8}}>
            <input style=${inp()} value=${c.label} onChange=${e=>updCta(i,'label',e.target.value)} placeholder="Button label e.g. Book Now"/>
            <input style=${inp()} value=${c.url} onChange=${e=>updCta(i,'url',e.target.value)} placeholder="https://… link"/>
            <button onClick=${()=>rmCta(i)} style=${{background:'none',border:'none',color:C.er,cursor:'pointer',fontSize:18}}>×</button>
          </div>
          <input style=${inp({fontSize:12})} value=${c.desc||''} onChange=${e=>updCta(i,'desc',e.target.value)} placeholder="Optional short guide text shown above this button, e.g. 'Watch this week's drill in action:'"/>
        </div>`)}
      </${Sec}>
    </${Card}>

    <${Card} style=${{padding:22,marginBottom:14}}>
      <${Sec} t="Footer sign-off" sub="Templated by default — customize the credentials and links as needed. Selecting a client auto-loads their Email Kit (App 1)." action=${html`<button onClick=${()=>applyKit(true)} style=${pbtn(false,{fontSize:12,padding:'4px 12px'})}>↻ Load Email Kit</button>`}>
        <textarea style=${inp({resize:'vertical',minHeight:80,fontSize:12,lineHeight:1.6})} value=${footer} onChange=${e=>setFooter(e.target.value)}/>
      </${Sec}>
    </${Card}>

    <${Card} style=${{padding:22,marginBottom:14}}>
      <${Sec} t="Schedule & audience">
        <div style=${G}>
          <${Fd} label="Broadcast date (Malaysia) *">
            <input style=${inp()} type="date" value=${schedDate} onChange=${e=>setSchedDate(e.target.value)}/>
          </${Fd}>
          <${Fd} label="Broadcast time (MYT) *">
            <input style=${inp()} type="time" value=${schedTime} onChange=${e=>setSchedTime(e.target.value)}/>
          </${Fd}>
          <${Fd} label="Send list" hint="Who receives this. More lists from App 5 (CRM) coming.">
            <select style=${inp()} value=${sendList} onChange=${e=>setSendList(e.target.value)}>
              <option value="titan_active">Titan Active Community (Brevo)</option>
              <option value="titan_b2b">Titan B2B Prospects</option>
            </select>
          </${Fd}>
          <${Fd} label="Client / brand (optional)">
            <select style=${inp()} value=${clientId} onChange=${e=>setClientId(e.target.value)}>
              <option value="">— none —</option>
              ${clients.map(c=>html`<option key=${c.id} value=${c.id}>${c.basics?.brandName||c.basics?.clientName}</option>`)}
            </select>
          </${Fd}>
        </div>
      </${Sec}>
    </${Card}>

    <div style=${{display:'flex',justifyContent:'flex-end',gap:8,paddingBottom:48}}>
      <button onClick=${onClose} style=${pbtn(false,{fontSize:13,padding:'9px 20px'})}>Cancel</button>
      <button onClick=${()=>save(false)} disabled=${saving} style=${pbtn(false,{fontSize:13,padding:'9px 20px'})}>${saving?'Saving…':'💾 Save for Approval (App 4)'}</button>
      <button onClick=${()=>save(true)} disabled=${saving} style=${pbtn(true,{fontSize:13,padding:'9px 24px',fontWeight:600})}>${saving?'Saving…':'✓ Save & Approve'}</button>
    </div>
  </div>`;
}

function App(){
  const[locked,setLocked]=useState(true);
  const[pin,setPin]=useState('');const[pErr,setPErr]=useState('');const[savedPin,setSavedPin]=useState(null);const[pmode,setPmode]=useState('check');const[pin2,setPin2]=useState('');
  const[clients,setClients]=useState([]);

          start_date:form.startDate,deadline:form.deadline,

          <div style=${{display:'flex',gap:4,flexWrap:'wrap'}}>
            ${[['all','All'],['draft','Draft'],['generating','Generating'],['review','Review'],['approved','Approved'],['published','Published']].map(([k,l])=>html`
              <button key=${k} onClick=${()=>setFilterStatus(k)} style=${{...pbtn(filterStatus===k),fontSize:11,padding:'5px 10px'}}>${l}</button>`)}
          </div>
        </div>
        ${filtered.length===0
          ?html`<div style=${{textAlign:'center',padding:'60px',color:C.dm}}>
            <div style=${{fontSize:48,marginBottom:14}}>📋</div>
            <div style=${{fontSize:17,color:C.tx,marginBottom:12}}>${campaigns.length===0?'No campaigns yet':'No results'}</div>
            ${campaigns.length===0&&html`<button onClick=${startNew} style=${pbtn(true,{padding:'10px 26px',fontSize:14})}>+ New Campaign Brief</button>`}
          </div>`
          :html`<div style=${{display:'flex',flexDirection:'column',gap:10}}>
            ${filtered.map(c=>html`
              <div key=${c.id} style=${{background:C.s1,border:`0.5px solid ${c.urgency==='urgent'?C.er:C.bd}`,borderRadius:10,padding:'14px 18px',cursor:'pointer',display:'grid',gridTemplateColumns:'1fr auto',gap:10,alignItems:'center'}}
                onMouseEnter=${e=>e.currentTarget.style.borderColor=C.bdB} onMouseLeave=${e=>e.currentTarget.style.borderColor=c.urgency==='urgent'?C.er:C.bd}
                onClick=${()=>openDet(c)}>
                <div>
                  <div style=${{display:'flex',alignItems:'center',gap:8,marginBottom:5,flexWrap:'wrap'}}>
                    <span style=${{fontSize:14,fontWeight:600,color:C.tx}}>${c.campaignName}</span>
                    <${SBadge} status=${c.status}/>
                    ${c.kpiType&&html`<span style=${{fontSize:11,color:C.pu}}>🎯 ${c.kpiType}</span>`}
                  </div>
                  <div style=${{display:'flex',gap:10,fontSize:12,color:C.dm,flexWrap:'wrap'}}>
                    <span>${c.brandName}</span><span>·</span><span>${c.goal}</span>
                    ${c.deadline&&html`<span>· 📅 ${fmtd(c.deadline)}</span>`}
                    ${c.kpiBudgetMYR&&html`<span>· 💰 MYR ${c.kpiBudgetMYR}</span>`}
                  </div>
                </div>
                <div style=${{textAlign:'right'}}><div style=${{fontSize:11,color:C.mt}}>${fmtdt(c.createdAt)}</div></div>
              </div>`)}
          </div>`}
      </div>`}
    </div>`;

  return html`
    <div style=${{minHeight:'100vh',background:C.bg,color:C.tx}}>
      ${hdr}
      <div style=${{paddingBottom:48}}>${view==='tracker'&&tracker}${view==='new'&&newForm}${view==='detail'&&detailView}${view==='email'&&html`<${EmailComposer} clients=${clients} onClose=${goBack} showToast=${showToast}/>`}</div>
      ${toast&&html`<div style=${{position:'fixed',bottom:24,right:24,background:C.s1,border:`1px solid ${toastType==='ok'?C.ok:toastType==='er'?C.er:C.wn}60`,borderRadius:8,padding:'10px 18px',fontSize:13,color:C.tx,zIndex:999,maxWidth:340}}>${toast}</div>`}
    </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
