// ── #22 TEXT OVERLAY: AI image models can't render legible text → generate a CLEAN background, then composite the real
//    headline/copy ON TOP with canvas (brand-aware), rasterise to a PNG, store as the final asset. Pure client-side
//    (verified: Fal + Supabase images allow crossOrigin canvas export — no taint, no server re-host).
const OVERLAY_DIMS={'1:1':[1080,1080],'4:5':[1080,1350],'9:16':[1080,1920],'16:9':[1600,900]};
const overlayDims=a=>OVERLAY_DIMS[a]||[1080,1080];
const OVERLAY_POS=[{k:'bottom',l:'Bottom'},{k:'top',l:'Top'},{k:'center',l:'Center'}];
function loadImg(url){return new Promise((res,rej)=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=()=>rej(new Error('image load failed (CORS?)'));im.src=url;});}
function _coverDraw(ctx,img,W,H){const ir=img.width/img.height,cr=W/H;let dw,dh;if(ir>cr){dh=H;dw=H*ir;}else{dw=W;dh=W/ir;}ctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);}
function _wrapLines(ctx,text,maxW){const words=String(text||'').trim().split(/\s+/);const lines=[];let line='';for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t;}if(line)lines.push(line);return lines;}
function _roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
// Compose {headline,subhead,cta} onto bgUrl → returns a <canvas>. accent = brand colour for the CTA pill.
async function composeOverlay({bgUrl,headline,subhead,cta,accent,aspect,pos}){
  const [W,H]=overlayDims(aspect);
  try{await document.fonts.ready;}catch(_){}
  const img=await loadImg(bgUrl);
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
  _coverDraw(ctx,img,W,H);
  const pad=Math.round(W*0.07),maxW=W-pad*2;
  const FAM="'Inter','Helvetica Neue',system-ui,'Segoe UI',Arial,sans-serif";
  // auto-fit headline: shrink until it wraps to ≤4 lines
  let fs=Math.round(W*0.088),lines=[''];
  for(;fs>=Math.round(W*0.044);fs-=2){ctx.font=`800 ${fs}px ${FAM}`;lines=_wrapLines(ctx,headline,maxW);if(lines.length<=4)break;}
  const lineH=fs*1.16,subFs=Math.max(18,Math.round(fs*0.42)),ctaFs=Math.max(18,Math.round(fs*0.40));
  const hHeadline=(headline||'').trim()?lines.length*lineH:0;
  const hSub=(subhead||'').trim()?subFs*1.5:0;
  const hCta=(cta||'').trim()?ctaFs*2.6:0;
  const blockH=hHeadline+hSub+hCta;
  let top;
  if(pos==='top')top=pad*1.2; else if(pos==='center')top=Math.max(pad,(H-blockH)/2); else top=H-blockH-pad*1.3;
  // legibility scrim behind the text band
  const g=ctx.createLinearGradient(0,top-pad*1.4,0,top+blockH+pad*0.8);
  if(pos==='top'){g.addColorStop(0,'rgba(0,0,0,0.74)');g.addColorStop(1,'rgba(0,0,0,0)');}
  else if(pos==='center'){g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(0.5,'rgba(0,0,0,0.55)');g.addColorStop(1,'rgba(0,0,0,0)');}
  else{g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.80)');}
  ctx.fillStyle=g;ctx.fillRect(0,Math.max(0,top-pad*1.4),W,blockH+pad*2.2);
  ctx.textAlign='left';ctx.textBaseline='top';
  let y=top;
  if((headline||'').trim()){
    ctx.font=`800 ${fs}px ${FAM}`;ctx.fillStyle='#ffffff';
    ctx.shadowColor='rgba(0,0,0,0.55)';ctx.shadowBlur=fs*0.14;ctx.shadowOffsetY=2;
    lines.forEach(ln=>{ctx.fillText(ln,pad,y);y+=lineH;});
    ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;

            `:isVideoFmt(t.format,t.channel)?html`
            <div style=${{marginBottom:10}}><${Lb}>Video direction / script (uploaded video is final — not AI-generated)</${Lb}><textarea style=${inp({resize:'vertical',minHeight:100,lineHeight:1.55})} value=${cr.visualPrompt||''} onChange=${e=>updTpCreative(t.id,'visualPrompt',e.target.value)} placeholder="Shot direction, script beats, what the clip should show…"/></div>
            <div style=${{display:'flex',gap:12,flexWrap:'wrap',alignItems:'flex-start',background:C.s2,border:`0.5px solid ${C.bd}`,borderRadius:10,padding:12}}>
              ${cr.imageUrl?html`<video src=${cr.imageUrl} controls style=${{width:180,maxHeight:200,borderRadius:8,border:`0.5px solid ${C.bd}`,flex:'0 0 auto',background:'#000'}}/>`:html`<div style=${{width:116,height:116,borderRadius:8,border:`1px dashed ${C.bd}`,display:'flex',alignItems:'center',justifyContent:'center',color:C.mt,fontSize:10,textAlign:'center',flex:'0 0 auto'}}>no video yet</div>`}
              <div style=${{flex:1,minWidth:240}}>
                <div style=${{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                  <label style=${{display:'inline-flex',alignItems:'center',gap:5,fontSize:11,fontWeight:500,color:C.tx,background:C.s3,border:`0.5px solid ${C.bd}`,borderRadius:7,padding:'6px 11px',cursor:tpImgBusy===t.id?'default':'pointer',opacity:tpImgBusy===t.id?.5:1}}>${tpImgBusy===t.id?'Uploading…':cr.imageUrl?'⬆ Replace video':'⬆ Upload video'}<input type="file" accept="video/*" disabled=${tpImgBusy===t.id} onChange=${e=>{const f=e.target.files&&e.target.files[0];e.target.value='';uploadTpVideo(t.id,f);}} style=${{display:'none'}}/></label>
                </div>
                <div style=${{fontSize:10.5,color:C.mt,marginTop:8,lineHeight:1.5}}>📐 Vertical 9:16, 1080×1920, mp4/H.264, under 90s. Uploads straight to the CDN — see <b>VIDEO_CONTENT_GUIDE.md</b> for the full spec.</div>
              </div>
            </div>
            `:html`
            <div style=${{marginBottom:10}}><${Lb}>Visual prompt (obeys concept's visual direction)</${Lb}><textarea style=${inp({resize:'vertical',minHeight:120,lineHeight:1.55})} value=${cr.visualPrompt||''} onChange=${e=>updTpCreative(t.id,'visualPrompt',e.target.value)} placeholder="Art direction for this touchpoint…"/></div>
            <div style=${{display:'flex',gap:12,flexWrap:'wrap',alignItems:'flex-start',background:C.s2,border:`0.5px solid ${C.bd}`,borderRadius:10,padding:12}}>
              ${cr.imageUrl?html`<img src=${cr.imageUrl} style=${{width:116,height:116,objectFit:'cover',borderRadius:8,border:`0.5px solid ${C.bd}`,flex:'0 0 auto'}}/>`:html`<div style=${{width:116,height:116,borderRadius:8,border:`1px dashed ${C.bd}`,display:'flex',alignItems:'center',justifyContent:'center',color:C.mt,fontSize:10,textAlign:'center',flex:'0 0 auto'}}>no image yet</div>`}
              <div style=${{flex:1,minWidth:240}}>
                <div style=${{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                  <button onClick=${()=>genTpImage(t.id)} disabled=${tpImgBusy===t.id||!cr.visualPrompt} style=${pbtn(false,{fontSize:11,padding:'6px 11px',opacity:(tpImgBusy===t.id||!cr.visualPrompt)?.5:1})}>${tpImgBusy===t.id?'Rendering…':cr.imageUrl?`🖼 Regenerate image (${tpAspect(t)})`:`🖼 Generate image (${tpAspect(t)})`}</button>
                  <label style=${{display:'inline-flex',alignItems:'center',gap:5,fontSize:11,fontWeight:500,color:C.tx,background:C.s3,border:`0.5px solid ${C.bd}`,borderRadius:7,padding:'6px 11px',cursor:tpImgBusy===t.id?'default':'pointer',opacity:tpImgBusy===t.id?.5:1}}>⬆ Upload image<input type="file" accept="image/*" disabled=${tpImgBusy===t.id} onChange=${e=>{const f=e.target.files&&e.target.files[0];e.target.value='';uploadTpImage(t.id,f);}} style=${{display:'none'}}/></label>
                </div>
                <div style=${{display:'flex',gap:8,alignItems:'flex-end',marginTop:8,flexWrap:'wrap'}}>
                  <div style=${{flex:1,minWidth:170}}><input style=${inp()} value=${cr.imgFb||''} onChange=${e=>updTpCreative(t.id,'imgFb',e.target.value)} placeholder="Image feedback (e.g. brighter, show the machine)…"/></div>
                  <button onClick=${()=>genTpImage(t.id)} disabled=${tpImgBusy===t.id||!cr.visualPrompt||!(cr.imgFb||'').trim()} style=${pbtn(false,{fontSize:11,padding:'8px 12px',opacity:(tpImgBusy===t.id||!cr.visualPrompt||!(cr.imgFb||'').trim())?.5:1})}>${tpImgBusy===t.id?'…':'✨ Regenerate with feedback'}</button>
                </div>
                ${chanSlug(t.channel)==='blog'?html`<div style=${{fontSize:10.5,color:C.mt,marginTop:8,lineHeight:1.5}}>📐 Blog hero recommended: <b>1200×630px</b> (1.91:1, social/OG card) or <b>1600×900px</b> (16:9). Min 1200px wide · JPG/PNG/WebP · ≤15MB.</div>`:''}
              </div>
            </div>
            ${(cr.imageUrl||cr.bgUrl)?html`<div style=${{marginTop:10,background:`${C.pu}0a`,border:`0.5px solid ${C.pu}33`,borderRadius:10,padding:12}}>
              <div style=${{fontSize:11,color:C.pu,fontWeight:600,marginBottom:8}}>🅰 Text overlay <span style=${{color:C.mt,fontWeight:400}}>— AI images can't spell; type the real words and we composite them legibly over the image</span></div>
              <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
                <input style=${inp({fontSize:12})} value=${(cr.ov||{}).headline||''} onChange=${e=>updOv(t.id,'headline',e.target.value)} placeholder="Headline (the big line)…"/>
                <input style=${inp({fontSize:12})} value=${(cr.ov||{}).subhead||''} onChange=${e=>updOv(t.id,'subhead',e.target.value)} placeholder="Subhead (optional)…"/>
                <input style=${inp({fontSize:12})} value=${(cr.ov||{}).cta||''} onChange=${e=>updOv(t.id,'cta',e.target.value)} placeholder=${`CTA button (e.g. ${(ed.ctas||[])[0]?.label||'Learn more'})…`}/>
                <select style=${inp({fontSize:12})} value=${(cr.ov||{}).pos||'bottom'} onChange=${e=>updOv(t.id,'pos',e.target.value)}>${OVERLAY_POS.map(o=>html`<option key=${o.k} value=${o.k}>Text: ${o.l}</option>`)}</select>
              </div>
              <div style=${{display:'flex',gap:8,flexWrap:'wrap'}}>
                <button onClick=${()=>applyOverlay(t.id)} disabled=${ovBusy===t.id} style=${pbtn(true,{fontSize:11,padding:'7px 14px',background:C.pu,opacity:ovBusy===t.id?.6:1})}>${ovBusy===t.id?'Compositing…':'🅰 Compose text overlay'}</button>
                ${cr.bgUrl&&cr.imageUrl!==cr.bgUrl?html`<button onClick=${()=>resetOverlay(t.id)} title="Revert to the clean AI background" style=${pbtn(false,{fontSize:11,padding:'7px 14px'})}>↺ Clean image</button>`:''}
              </div>
            </div>`:''}
            `}
          </div>`;})}
        </div>
      </div>`}

      <div style=${{display:'flex',justifyContent:'space-between',gap:8,marginTop:18}}>
        <button onClick=${()=>setView('media')} style=${pbtn(false,{fontSize:13,padding:'9px 16px'})}>← Media Plan</button>
        <div style=${{display:'flex',gap:8}}>
          <button onClick=${saveDraft} disabled=${saving} style=${pbtn(false,{fontSize:13,padding:'9px 18px'})}>Save as Draft</button>
          <button onClick=${proceedToApp3} disabled=${saving} style=${pbtn(true,{fontSize:13,padding:'9px 22px',fontWeight:600,background:C.ok})}>${saving?'Saving…':'Save & Proceed → App 3'}</button>
        </div>
      </div>
      <div style=${{background:`${C.tl}0a`,border:`0.5px dashed ${C.tl}40`,borderRadius:8,padding:'12px 16px',margin:'16px 0 40px',fontSize:12,color:C.dm,lineHeight:1.6}}>
        <span style=${{color:C.tl}}>Save & Proceed</span> emits one <b>content_approvals</b> row per touchpoint (canonical schema + full asset-ID lineage) into App 3 (Content Production & Publisher) for review → approve → publish. Re-running is safe: it updates still-pending items and never overwrites anything you've already approved in App 3.
      </div>
    </div>`;

  return html`
    <div style=${{minHeight:'100vh',background:C.bg,color:C.tx}}>
      ${hdr}
      ${crumb}
      ${(view==='brief'||view==='media'||view==='creative')&&stepper}
      <div style=${{paddingBottom:48}}>${view==='clients'&&clientsView}${view==='brands'&&brandsView}${view==='dash'&&dash}${view==='brief'&&brief}${view==='media'&&mediaView}${view==='creative'&&creativeView}</div>
      ${toast&&html`<div style=${{position:'fixed',bottom:24,right:24,background:C.s1,border:`1px solid ${toastType==='ok'?C.ok:C.er}60`,borderRadius:8,padding:'10px 18px',fontSize:13,color:C.tx,zIndex:999}}>${toast}</div>`}
    </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
